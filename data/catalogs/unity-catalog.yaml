id: unity_catalog
name: Unity Catalog
type: catalog
vendor: Databricks / LF AI & Data
open_source: true
license: Apache 2.0
website: https://www.unitycatalog.io
description: >
  Open-source multi-modal catalog supporting Delta Lake, Iceberg, and Hudi.
  Exposes Iceberg REST catalog endpoint for external engine access.
  Hosted by LF AI & Data Foundation.
rest_api: full
vended_credentials: true
multi_cloud:
  - S3
  - ADLS
  - GCS
view_support: partial
multi_table_transactions: none
version_control: false
catalog_federation: preview
multi_format:
  - Delta Lake
  - Iceberg
  - Hudi
notes: >
  REST endpoint at /api/2.1/unity-catalog/iceberg-rest. Catalog federation
  (preview) enables governing Iceberg tables in Glue, HMS, and Snowflake
  Horizon. Ecosystem includes AWS, Google Cloud, Confluent, DuckDB.
last_verified: "2026-03-27"
