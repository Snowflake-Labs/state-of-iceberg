id: glue
name: AWS Glue Data Catalog
type: catalog
vendor: AWS
open_source: false
website: https://aws.amazon.com/glue/
description: >
  AWS-managed metadata catalog for Iceberg tables. Integrates with Athena,
  Redshift, and EMR. Includes automatic optimization for compaction,
  snapshot management, and orphan file cleanup.
rest_api: full
vended_credentials: true
multi_cloud:
  - S3
view_support: none
multi_table_transactions: none
version_control: false
catalog_federation: full
multi_format:
  - Iceberg
notes: >
  Iceberg REST endpoint available via AWS Glue, authenticated with
  SigV4. Supports Iceberg table spec v1 and v2 (default v2). Catalog
  federation GA (November 2025) for federating remote Iceberg catalogs
  with real-time metadata sync. Lake Formation integration for access
  controls. View APIs not supported. RenameTable only supported for
  Redshift-managed tables.
last_verified: "2026-04-08"
