id: biglake
name: BigLake Metastore
type: catalog
vendor: Google Cloud
open_source: false
website: https://cloud.google.com/biglake
description: >
  Fully managed, serverless Iceberg metastore for Google Cloud. Unified
  metadata management across BigQuery, Spark, Flink, and other Iceberg
  engines. REST Catalog API support in preview.
rest_api: full
vended_credentials: true
multi_cloud:
  - GCS
view_support: none
multi_table_transactions: none
version_control: false
catalog_federation: none
multi_format:
  - Iceberg
notes: >
  Iceberg REST Catalog GA. Endpoint at
  biglake.googleapis.com/iceberg/v1beta/restcatalog. Supports credential
  vending for fine-grained access control. Integrated with Dataplex
  Universal Catalog for lineage, data quality, and discoverability.
  Cross-region replication supported. Legacy BigLakeCatalog plugin
  (org.apache.iceberg.gcp.biglake.BigLakeCatalog) still available for
  Iceberg library versions 0.14.0-1.9.1.
last_verified: "2026-04-08"
