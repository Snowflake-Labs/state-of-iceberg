id: biglake
name: BigLake Metastore
type: catalog
vendor: Google Cloud
open_source: false
website: https://cloud.google.com/biglake
description: >
  Fully managed, serverless Iceberg metastore for Google Cloud. Unified
  metadata management across BigQuery, Spark, Flink, and other Iceberg
  engines. REST Catalog API support in preview.
rest_api: preview
vended_credentials: false
multi_cloud:
  - GCS
view_support: none
multi_table_transactions: none
version_control: false
catalog_federation: none
multi_format:
  - Iceberg
notes: >
  GA as of May 2025. External engines access via BigLakeCatalog plugin
  (org.apache.iceberg.gcp.biglake.BigLakeCatalog) for Iceberg library
  versions 0.14.0-1.9.1. Custom plugin is less universal than standard
  REST endpoint.
last_verified: "2026-03-27"
