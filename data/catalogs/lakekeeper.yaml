id: lakekeeper
name: Lakekeeper
type: catalog
vendor: Community (Rust)
open_source: true
license: Apache 2.0
website: https://lakekeeper.io
description: >
  Rust-native REST catalog focused on operational excellence. Fine-grained
  access control via OpenFGA, multi-tenant architecture, CloudEvents for
  change streaming, Kubernetes-native deployment.
rest_api: full
vended_credentials: true
multi_cloud:
  - S3
view_support: none
multi_table_transactions: none
version_control: false
catalog_federation: none
multi_format:
  - Iceberg
notes: >
  Integration-tested with Spark, PyIceberg, Trino, and StarRocks.
  v0.11.3 as of March 2026. OpenID integration for external identity
  providers. Helm chart and operator for Kubernetes.
last_verified: "2026-03-27"
