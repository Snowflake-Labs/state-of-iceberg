id: kafka-connect
name: Kafka Connect (Iceberg Sink)
type: engine
vendor: Apache Iceberg
open_source: true
website: https://iceberg.apache.org/docs/latest/kafka-connect/
description: >-
  The official Apache Iceberg sink connector for Kafka Connect enables streaming ingestion
  from Kafka topics into Iceberg tables. It supports exactly-once delivery, multi-table
  fan-out, automatic table creation, and schema auto-evolution.

spec_support:
  v1: false
  v2: true
  v3: false

file_formats:
  parquet: true
  orc: false
  avro: true

dml:
  insert: full
  update: partial
  delete: partial
  merge: none
  truncate: none

capabilities:
  schema_evolution: full
  type_widening: unknown
  partition_evolution: none
  hidden_partitioning: unknown
  time_travel: none
  position_deletes: none
  equality_deletes: none
  merge_on_read: none
  copy_on_write: none
  branching_tagging: none
  iceberg_views: none
  streaming_write: full

maintenance:
  auto_compaction: none
  manual_compaction: none
  snapshot_expiry: none
  orphan_cleanup: none
  manifest_rewrite: none

catalog_integrations:
  - catalog: polaris
    mode: write
  - catalog: nessie
    mode: write
  - catalog: hms
    mode: write
  - catalog: glue
    mode: write

notes: >-
  Official Apache Iceberg sink connector. Exactly-once delivery semantics.
  Multi-table fan-out from single Kafka topic. Auto table creation and schema
  auto-evolution. Update and delete via CDC mode only.

last_verified: "2026-03-27"
