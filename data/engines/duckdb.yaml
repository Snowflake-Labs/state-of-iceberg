id: duckdb
name: DuckDB
type: engine
vendor: DuckDB Labs
open_source: true
website: https://duckdb.org/
description: >-
  DuckDB is an in-process analytical database with Iceberg support via the iceberg extension.
  It provides fast local analytics with read/write capabilities for Parquet-based Iceberg tables
  and supports multiple REST-compatible catalogs.

spec_support:
  v1: true
  v2: true
  v3: false

file_formats:
  parquet: true
  orc: false
  avro: false

dml:
  insert: full
  update: full
  delete: full
  merge: none
  truncate: none

capabilities:
  schema_evolution: full
  type_widening: full
  partition_evolution: partial
  hidden_partitioning: partial
  time_travel: partial
  position_deletes: full
  equality_deletes: none
  merge_on_read: full
  copy_on_write: none
  branching_tagging: none
  iceberg_views: none
  streaming_write: none

maintenance:
  auto_compaction: none
  manual_compaction: none
  snapshot_expiry: none
  orphan_cleanup: none
  manifest_rewrite: none

catalog_integrations:
  - catalog: polaris
    mode: read_write
  - catalog: lakekeeper
    mode: read_write
  - catalog: s3_tables
    mode: read_write
  - catalog: unity_catalog
    mode: read_write
  - catalog: glue
    mode: read_write
    notes: Via ENDPOINT_TYPE 'glue' or SigV4 authorization
  - catalog: onelake
    mode: read
  - catalog: horizon
    mode: read_write
  - catalog: hms
    mode: read_write
  - catalog: nessie
    mode: read_write
  - catalog: gravitino
    mode: read_write
  - catalog: biglake
    mode: read_write

notes: >-
  Write support limited to non-partitioned, non-sorted tables. Browser support
  via WebAssembly (Dec 2025). No built-in maintenance procedures.

last_verified: "2026-03-27"
