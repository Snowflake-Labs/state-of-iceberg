id: trino
name: Trino
type: engine
vendor: Trino community
open_source: true
website: https://trino.io/
description: >-
  Trino is a distributed SQL query engine with Iceberg integration supporting full DML
  and read/write capabilities. It connects to multiple catalog types and is used for
  interactive analytics on Iceberg tables.

spec_support:
  v1: true
  v2: true
  v3: false

file_formats:
  parquet: true
  orc: true
  avro: true

dml:
  insert: full
  update: full
  delete: full
  merge: full
  truncate: full

capabilities:
  schema_evolution: full
  type_widening: full
  partition_evolution: full
  hidden_partitioning: full
  time_travel: full
  position_deletes: full
  equality_deletes: full
  merge_on_read: full
  copy_on_write: none
  branching_tagging: full
  iceberg_views: partial
  streaming_write: none

maintenance:
  auto_compaction: none
  manual_compaction: full
  snapshot_expiry: full
  orphan_cleanup: full
  manifest_rewrite: full

catalog_integrations:
  - catalog: hms
    mode: read_write
  - catalog: glue
    mode: read_write
  - catalog: polaris
    mode: read_write
  - catalog: nessie
    mode: read_write
  - catalog: unity_catalog
    mode: read_write
  - catalog: s3_tables
    mode: read_write
  - catalog: lakekeeper
    mode: read_write

notes: >-
  Copy-on-write not supported (open issue). Iceberg views support is partial.

last_verified: "2026-03-27"
