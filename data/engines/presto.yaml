id: presto
name: Presto
type: engine
vendor: Presto Foundation
open_source: true
website: https://prestodb.io/
description: >-
  Presto is a distributed SQL query engine originally developed at Facebook, with Iceberg
  support for v1 and v2 tables. It provides read/write capabilities with v3 support
  currently in development.

spec_support:
  v1: true
  v2: true
  v3: false

file_formats:
  parquet: true
  orc: true
  avro: true

dml:
  insert: full
  update: full
  delete: full
  merge: partial
  truncate: none

capabilities:
  schema_evolution: full
  type_widening: unknown
  partition_evolution: full
  hidden_partitioning: full
  time_travel: full
  position_deletes: full
  equality_deletes: full
  merge_on_read: full
  copy_on_write: none
  branching_tagging: none
  iceberg_views: none
  streaming_write: none

maintenance:
  auto_compaction: none
  manual_compaction: partial
  snapshot_expiry: full
  orphan_cleanup: full
  manifest_rewrite: partial

catalog_integrations:
  - catalog: hms
    mode: read_write
  - catalog: nessie
    mode: read_write
  - catalog: polaris
    mode: read_write

last_verified: "2026-03-27"
