id: spark
name: Apache Spark
type: engine
vendor: Apache
open_source: true
website: https://spark.apache.org/
description: Apache Spark is the reference implementation for Apache Iceberg. It supports all three spec versions, full DML operations, and all table maintenance procedures.
spec_support:
  v1: true
  v2: true
  v3: true
file_formats:
  parquet: true
  orc: true
  avro: true
dml:
  insert: full
  update: full
  delete: full
  merge: full
  truncate: full
capabilities:
  schema_evolution: full
  type_widening: full
  partition_evolution: full
  hidden_partitioning: full
  time_travel: full
  position_deletes: full
  equality_deletes: full
  merge_on_read: full
  copy_on_write: full
  branching_tagging: full
  iceberg_views: full
  streaming_write: full
maintenance:
  auto_compaction: none
  manual_compaction: full
  snapshot_expiry: full
  orphan_cleanup: full
  manifest_rewrite: full
catalog_integrations:
- catalog: hms
  mode: read_write
  source: https://iceberg.apache.org/docs/latest/spark-configuration/
- catalog: glue
  mode: read_write
  source: https://iceberg.apache.org/docs/latest/spark-configuration/
- catalog: polaris
  mode: read_write
  source: https://iceberg.apache.org/docs/latest/spark-configuration/
- catalog: nessie
  mode: read_write
  source: https://iceberg.apache.org/docs/latest/spark-configuration/
- catalog: unity_catalog
  mode: read_write
  source: https://iceberg.apache.org/docs/latest/spark-configuration/
- catalog: s3_tables
  mode: read_write
  source: https://iceberg.apache.org/docs/latest/spark-configuration/
- catalog: lakekeeper
  mode: read_write
  source: https://iceberg.apache.org/docs/latest/spark-configuration/
- catalog: gravitino
  mode: read_write
  source: https://iceberg.apache.org/docs/latest/spark-configuration/
- catalog: biglake
  mode: read_write
  source: https://iceberg.apache.org/docs/latest/spark-configuration/
- catalog: horizon
  mode: read_write
  source: https://iceberg.apache.org/docs/latest/spark-configuration/
- catalog: onelake
  mode: read
  source: https://iceberg.apache.org/docs/latest/spark-configuration/
notes: Iceberg views supported in Spark 4.0+. Maintenance via rewrite_data_files, expire_snapshots, remove_orphan_files, and rewrite_manifests procedures.
last_verified: '2026-03-27'
