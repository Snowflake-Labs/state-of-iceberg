id: hive
name: Apache Hive
type: engine
vendor: Apache
open_source: true
website: https://hive.apache.org/
description: Apache Hive 4.0 adds native Iceberg table support with full DML operations using copy-on-write via the Tez execution engine. It uses the Hive Metastore as its primary catalog.
spec_support:
  v1: true
  v2: true
  v3: false
file_formats:
  parquet: true
  orc: true
  avro: true
dml:
  insert: full
  update: full
  delete: full
  merge: full
  truncate: full
capabilities:
  schema_evolution: full
  type_widening: unknown
  partition_evolution: full
  hidden_partitioning: full
  time_travel: full
  position_deletes: full
  equality_deletes: partial
  merge_on_read: partial
  copy_on_write: full
  branching_tagging: full
  iceberg_views: none
  streaming_write: none
maintenance:
  auto_compaction: none
  manual_compaction: full
  snapshot_expiry: full
  orphan_cleanup: full
  manifest_rewrite: none
catalog_integrations:
- catalog: hms
  mode: read_write
  source: https://iceberg.apache.org/docs/latest/hive/
- catalog: glue
  mode: read_write
  source: https://iceberg.apache.org/docs/latest/hive/
- catalog: polaris
  mode: read_write
  source: https://iceberg.apache.org/docs/latest/configuration/#catalog-properties
- catalog: nessie
  mode: read_write
  source: https://iceberg.apache.org/docs/latest/configuration/#catalog-properties
- catalog: unity_catalog
  mode: read_write
  source: https://iceberg.apache.org/docs/latest/configuration/#catalog-properties
- catalog: s3_tables
  mode: read_write
  source: https://iceberg.apache.org/docs/latest/configuration/#catalog-properties
- catalog: lakekeeper
  mode: read_write
  source: https://iceberg.apache.org/docs/latest/configuration/#catalog-properties
- catalog: gravitino
  mode: read_write
  source: https://iceberg.apache.org/docs/latest/configuration/#catalog-properties
- catalog: biglake
  mode: read_write
  source: https://iceberg.apache.org/docs/latest/configuration/#catalog-properties
- catalog: horizon
  mode: read_write
  source: https://iceberg.apache.org/docs/latest/configuration/#catalog-properties
- catalog: onelake
  mode: read
  source: https://iceberg.apache.org/docs/latest/configuration/#catalog-properties
notes: DML (update/delete/merge) requires Tez execution engine and copy-on-write mode. Equality deletes supported read-only. Merge-on-read supported for reads only. Manual compaction operates on full tables.
last_verified: '2026-03-27'
