id: databricks
name: Databricks
type: platform
vendor: Databricks
open_source: false
website: https://www.databricks.com
description: Unified analytics platform offering Iceberg support through UniForm (Delta compatibility layer) and native Iceberg managed tables. Provides full DML, predictive optimization, and integration
  with Unity Catalog for governance and interoperability.
spec_support:
  v1: true
  v2: true
  v3: preview
file_formats:
  parquet: true
  orc: false
  avro: false
dml:
  insert: full
  update: full
  delete: full
  merge: full
  truncate: full
capabilities:
  schema_evolution: full
  type_widening: full
  partition_evolution: full
  hidden_partitioning: full
  time_travel: full
  position_deletes: none
  equality_deletes: none
  merge_on_read: full
  copy_on_write: full
  branching_tagging: partial
  iceberg_views: none
  streaming_write: full
maintenance:
  auto_compaction: full
  manual_compaction: full
  snapshot_expiry: full
  orphan_cleanup: full
  manifest_rewrite: full
catalog_integrations:
- catalog: unity_catalog
  mode: read_write
  source: https://docs.databricks.com/en/external-access/iceberg.html
- catalog: glue
  mode: read
  notes: Read-only via Lakehouse Federation foreign catalogs
  source: https://docs.databricks.com/aws/en/query-federation/hms-federation-glue
- catalog: hms
  mode: read
  notes: Read-only via Lakehouse Federation foreign catalogs
  source: https://docs.databricks.com/aws/en/query-federation/hms-federation-concepts
notes: Two Iceberg modes - UniForm (Delta compatibility layer) and native Iceberg managed tables (DBR 16.4+). v3 on managed Iceberg tables DBR 18.0+. Branching/tagging partial via Delta, not
  Iceberg-native. Databricks uses v3 deletion vectors instead of v2 position/equality delete files — row-level deletes are fully supported via this alternative mechanism. HMS and Glue access is read-only via
  Lakehouse Federation.
last_verified: '2026-03-27'
