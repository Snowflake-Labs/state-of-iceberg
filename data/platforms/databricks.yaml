id: databricks
name: Databricks
type: platform
vendor: Databricks
open_source: false
website: https://www.databricks.com
description: >-
  Unified analytics platform offering Iceberg support through UniForm (Delta compatibility layer)
  and native Iceberg managed tables. Provides full DML, predictive optimization, and
  integration with Unity Catalog for governance and interoperability.

spec_support:
  v1: true
  v2: true
  v3: preview

file_formats:
  parquet: true
  orc: false
  avro: false

dml:
  insert: full
  update: full
  delete: full
  merge: full
  truncate: full

capabilities:
  schema_evolution: full
  type_widening: full
  partition_evolution: full
  hidden_partitioning: full
  time_travel: full
  position_deletes: full
  equality_deletes: full
  merge_on_read: full
  copy_on_write: full
  branching_tagging: partial
  iceberg_views: none
  streaming_write: full

maintenance:
  auto_compaction: full
  manual_compaction: full
  snapshot_expiry: full
  orphan_cleanup: full
  manifest_rewrite: full

catalog_integrations:
  - catalog: unity_catalog
    mode: read_write
  - catalog: glue
    mode: read_write
  - catalog: hms
    mode: read_write
  - catalog: polaris
    mode: read_write

notes: >-
  Two Iceberg modes - UniForm (Delta compatibility layer, GA) and native Iceberg managed
  tables (Public Preview, DBR 16.4+). v3 on managed Iceberg tables DBR 18.0+.
  Branching/tagging partial via Delta, not Iceberg-native.

last_verified: "2026-03-27"
