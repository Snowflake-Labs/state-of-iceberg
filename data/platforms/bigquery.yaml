id: bigquery
name: Google BigQuery
type: platform
vendor: Google Cloud
open_source: false
website: https://cloud.google.com/bigquery
description: Serverless data warehouse with managed Apache Iceberg tables via BigLake. Provides fully autonomous storage optimization and Iceberg v2 snapshot export for external engine interoperability.
spec_support:
  v1: false
  v2: true
  v3: false
file_formats:
  parquet: true
  orc: false
  avro: false
dml:
  insert: full
  update: full
  delete: full
  merge: full
  truncate: full
  bulk_load: Storage Write API
capabilities:
  schema_evolution: full
  type_widening: full
  partition_evolution: unknown
  hidden_partitioning: full
  time_travel: full
  position_deletes: full
  equality_deletes: unknown
  merge_on_read: unknown
  copy_on_write: unknown
  branching_tagging: none
  iceberg_views: none
  streaming_write: full
maintenance:
  auto_compaction: full
  manual_compaction: full
  snapshot_expiry: full
  orphan_cleanup: full
  manifest_rewrite: full
catalog_integrations:
- catalog: biglake
  mode: read_write
  source: https://cloud.google.com/bigquery/docs/iceberg-tables
notes: Managed Iceberg tables via BigLake, GA May 2025. Fully autonomous storage optimization. Iceberg v2 snapshot export for external engine interop.
last_verified: '2026-03-27'
