id: snowflake
name: Snowflake
type: platform
vendor: Snowflake
open_source: false
website: https://www.snowflake.com
description: Cloud data platform with native Apache Iceberg table support for managed and unmanaged tables. Snowflake provides full DML, automatic maintenance, and cross-cloud catalog interoperability through
  Polaris Catalog and external catalog federation.
spec_support:
  v1: true
  v2: true
  v3: preview
file_formats:
  parquet: true
  orc: ingest_only
  avro: ingest_only
dml:
  insert: full
  update: full
  delete: full
  merge: full
  truncate: full
  bulk_load: COPY INTO, Snowpipe
capabilities:
  schema_evolution: full
  type_widening: full
  partition_evolution: none
  hidden_partitioning: full
  time_travel: full
  position_deletes: full
  equality_deletes: none
  merge_on_read: partial
  copy_on_write: full
  branching_tagging: none
  iceberg_views: none
  streaming_write: partial
maintenance:
  auto_compaction: full
  manual_compaction: full
  snapshot_expiry: full
  orphan_cleanup: full
  manifest_rewrite: full
catalog_integrations:
- catalog: polaris
  mode: read_write
  auth: oauth
  source: https://docs.snowflake.com/en/user-guide/tables-iceberg-configure-catalog-integration-open-catalog
- catalog: glue
  mode: read_write
  auth: sigv4
  source: https://docs.snowflake.com/en/user-guide/tables-iceberg-configure-catalog-integration-rest-glue
- catalog: unity_catalog
  mode: read_write
  auth: oauth
  source: https://docs.snowflake.com/en/user-guide/tables-iceberg-configure-catalog-integration-rest-unity
- catalog: s3_tables
  mode: read
  notes: Via Glue federation
- catalog: onelake
  mode: read
  auth: oauth
  notes: Read-only per Snowflake docs.
  source: https://docs.snowflake.com/en/user-guide/tables-iceberg-configure-catalog-integration-rest-onelake
- catalog: horizon
  mode: read_write
  notes: Built-in Iceberg REST endpoint for external engine access
  source: https://docs.snowflake.com/en/user-guide/tables-iceberg-access-using-external-query-engine-snowflake-horizon
- catalog: nessie
  mode: read_write
  source: https://docs.snowflake.com/en/user-guide/tables-iceberg-configure-catalog-integration-rest
- catalog: lakekeeper
  mode: read_write
  source: https://docs.snowflake.com/en/user-guide/tables-iceberg-configure-catalog-integration-rest
- catalog: gravitino
  mode: read_write
  source: https://docs.snowflake.com/en/user-guide/tables-iceberg-configure-catalog-integration-rest
- catalog: biglake
  mode: read_write
  source: https://docs.snowflake.com/en/user-guide/tables-iceberg-configure-catalog-integration-rest
- catalog: hms
  mode: read_write
  source: https://docs.snowflake.com/en/user-guide/tables-iceberg-configure-catalog-integration-rest
notes: Set STORAGE_SERIALIZATION_POLICY = 'COMPATIBLE' for cross-engine reads. v3 adds deletion vectors, nanosecond timestamps, VARIANT, GEOGRAPHY/GEOMETRY. Snowflake uses copy-on-write exclusively for
  managed tables; merge-on-read supported only for externally managed Iceberg tables. Equality deletes are not supported — Snowflake uses copy-on-write for all DELETE operations.
last_verified: '2026-03-27'
