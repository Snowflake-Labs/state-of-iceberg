id: cloudera
name: Cloudera CDP
type: platform
vendor: Cloudera
open_source: false
website: https://www.cloudera.com
description: >-
  Enterprise data platform with multi-engine Iceberg support across Hive, Spark, Impala,
  and Flink. The only vendor offering an Iceberg-powered lakehouse for private data centers
  and hybrid cloud deployments.

spec_support:
  v1: true
  v2: true
  v3: false

file_formats:
  parquet: true
  orc: true
  avro: true

dml:
  insert: full
  update: partial
  delete: full
  merge: partial
  truncate: partial

capabilities:
  schema_evolution: full
  type_widening: full
  partition_evolution: full
  hidden_partitioning: full
  time_travel: full
  position_deletes: full
  equality_deletes: full
  merge_on_read: full
  copy_on_write: full
  branching_tagging: partial
  iceberg_views: none
  streaming_write: none

maintenance:
  auto_compaction: none
  manual_compaction: full
  snapshot_expiry: full
  orphan_cleanup: full
  manifest_rewrite: full

catalog_integrations:
  - catalog: hms
    mode: read_write

notes: >-
  Multi-engine (Hive, Spark, Impala, Flink). Only vendor offering Iceberg-powered lakehouse
  in private data centers. UPDATE and MERGE partial (Spark only). Branching/tagging partial
  (Spark only). Manual maintenance via Spark procedures.

last_verified: "2026-03-27"
